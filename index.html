<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Task Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1A1916">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Task Tracker">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<header>
  <div>
    <h1>Task Tracker</h1>
    <div class="header-sub">Points &amp; Progress</div>
  </div>
  <div style="display:flex;align-items:center;gap:0.75rem;">
    <span class="offline-badge" id="offline-badge">Offline Ready</span>
    <div class="header-actions">
      <button class="btn-menu" id="btn-menu" onclick="toggleMenu()" aria-label="Menu">☰</button>
      <div class="menu-dropdown" id="menu-dropdown">
        <button class="menu-item" onclick="toggleEditMode(); toggleMenu(false)" id="btn-edit-mode">Edit Mode</button>
        <button class="menu-item" onclick="toggleTheme(); toggleMenu(false)" id="btn-theme-toggle">🌙</button>
        <button class="menu-item" onclick="exportData(); toggleMenu(false)">Export</button>
        <button class="menu-item" onclick="importData(); toggleMenu(false)">Import</button>
      </div>
    </div>
  </div>
</header>

<div class="main">
  <div class="summary-bar" id="summary-bar" style="display:none;">
    <div class="stat-card highlight">
      <div class="stat-label">Current Total</div>
      <div class="stat-value" id="stat-current">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Points Earned</div>
      <div class="stat-value" id="stat-earned">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Tasks Logged</div>
      <div class="stat-value" id="stat-logged">0</div>
    </div>
  </div>

  <div class="toolbar edit-only">
    <div class="toolbar-left">
      <input type="text" class="task-name-input" id="new-task-name" placeholder="Task name…" maxlength="80" />
      <input type="number" id="new-task-pts" placeholder="Pts" min="1" max="9999" value="10" />
    </div>
    <button class="btn-add" onclick="addTask()">+ Add Task</button>
  </div>
  <div class="toolbar" style="margin-bottom:0.5rem;">
    <button id="btn-reset-points" class="btn-reset-all" onclick="resetAll()">Reset Points</button>
  </div>

  <div class="section-title">
    <span>Tasks</span>
    <span id="task-count"></span>
  </div>
  <div class="tasks-list" id="tasks-list">
    <div class="empty-state">
      <div class="empty-icon">◻</div>
      Add your first task above
    </div>
  </div>

  <div class="divider"></div>

  <div class="toolbar edit-only">
    <div class="toolbar-left">
      <input type="text" class="task-name-input" id="new-reward-name" placeholder="Reward name…" maxlength="80" />
      <input type="number" id="new-reward-pts" placeholder="Pts" value="-10" />
    </div>
    <button class="btn-add" onclick="addReward()" style="background:#5A2D82;border-color:#5A2D82;">+ Add Reward</button>
  </div>

  <div class="section-title">
    <span>Rewards</span>
    <span id="reward-count"></span>
  </div>
  <div class="tasks-list" id="rewards-list">
    <div class="empty-state">
      <div class="empty-icon">◻</div>
      Add your first reward above
    </div>
  </div>

  <div class="divider"></div>

  <div class="toolbar edit-only" style="flex-wrap:wrap;">
    <div class="toolbar-left" style="flex-wrap:wrap;">
      <input type="text" class="task-name-input" id="new-rule-text" placeholder="Rule…" maxlength="120" />
      <input type="text" class="task-name-input" id="new-rule-consequence" placeholder="Consequence…" maxlength="120" />
    </div>
    <button class="btn-add" onclick="addRule()" style="background:#6B4C11;border-color:#6B4C11;">+ Add Rule</button>
  </div>

  <div class="section-title">
    <span>Rules / Consequences</span>
    <span id="rule-count"></span>
  </div>
  <div class="tasks-list" id="rules-list">
    <div class="empty-state">
      <div class="empty-icon">◻</div>
      Add your first rule above
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'task_tracker_v1';
const REWARDS_KEY = 'task_tracker_rewards_v1';
const CURRENT_KEY = 'task_tracker_current_v1';
const RULES_KEY   = 'task_tracker_rules_v1';
const THEME_KEY   = 'task_tracker_theme_v1';

let tasks = [], rewards = [], rules = [], currentTotal = 0;

function load() {
  try { const r = localStorage.getItem(STORAGE_KEY);  if (r) tasks   = JSON.parse(r); } catch(e) { tasks = []; }
  try { const r = localStorage.getItem(REWARDS_KEY);  if (r) rewards = JSON.parse(r); } catch(e) { rewards = []; }
  try { const r = localStorage.getItem(RULES_KEY);    if (r) rules   = JSON.parse(r); } catch(e) { rules = []; }
  try { const r = localStorage.getItem(CURRENT_KEY);  if (r !== null) currentTotal = parseInt(r) || 0; } catch(e) { currentTotal = 0; }
  render();
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY,  JSON.stringify(tasks));
    localStorage.setItem(REWARDS_KEY,  JSON.stringify(rewards));
    localStorage.setItem(RULES_KEY,    JSON.stringify(rules));
    localStorage.setItem(CURRENT_KEY,  String(currentTotal));
  } catch(e) {}
}

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(str) { return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Edit Mode ──────────────────────────────────────────────────────

let editMode = false;

function applyEditMode() {
  document.body.classList.toggle('edit-mode', editMode);
  document.getElementById('btn-edit-mode').textContent = editMode ? 'Done Editing' : 'Edit Mode';
  var editable = document.querySelectorAll('.task-name, .rule-col-text, .worth-badge span[onblur]');
  editable.forEach(function(el) {
    el.contentEditable = editMode;
  });
}

function toggleEditMode() {
  editMode = !editMode;
  applyEditMode();
}

// ── Theme / Dark Mode ──────────────────────────────────────────────
function applyTheme() {
  const dark = localStorage.getItem(THEME_KEY) === 'dark';
  document.body.classList.toggle('dark-mode', dark);
  const btn = document.getElementById('btn-theme-toggle'); if (btn) btn.textContent = dark ? '☀️' : '🌙';
}

function toggleTheme() {
  const currentlyDark = document.body.classList.toggle('dark-mode');
  localStorage.setItem(THEME_KEY, currentlyDark ? 'dark' : 'light');
  const btn = document.getElementById('btn-theme-toggle'); if (btn) btn.textContent = currentlyDark ? '☀️' : '🌙';
}

function toggleMenu(open) {
  const menu = document.getElementById('menu-dropdown');
  if (!menu) return;
  const shouldOpen = typeof open === 'boolean' ? open : !menu.classList.contains('open');
  menu.classList.toggle('open', shouldOpen);
}

window.addEventListener('click', function(event) {
  const menu = document.getElementById('menu-dropdown');
  const btn = document.getElementById('btn-menu');
  if (!menu || !btn) return;
  if (!menu.contains(event.target) && !btn.contains(event.target)) {
    menu.classList.remove('open');
  }
});

// ── Tasks ──────────────────────────────────────────────────────────

function addTask() {
  const nameEl = document.getElementById('new-task-name');
  const ptsEl  = document.getElementById('new-task-pts');
  const name = nameEl.value.trim(), pts = parseInt(ptsEl.value) || 10;
  if (!name) { nameEl.focus(); return; }
  tasks.push({ id: uid(), name, worth: pts, earned: 0 });
  nameEl.value = ''; ptsEl.value = '10'; nameEl.focus();
  save(); render();
}

function increment(id) {
  const t = tasks.find(t => t.id === id); if (!t) return;
  t.earned += t.worth; currentTotal += t.worth;
  save(); render(); flashCard(id, 'flash');
}

function decrement(id) {
  const t = tasks.find(t => t.id === id); if (!t) return;
  const delta = Math.min(t.worth, t.earned);
  t.earned = Math.max(0, t.earned - t.worth); currentTotal -= delta;
  save(); render();
}

// ── Rewards ────────────────────────────────────────────────────────

function addReward() {
  const nameEl = document.getElementById('new-reward-name');
  const ptsEl  = document.getElementById('new-reward-pts');
  const name = nameEl.value.trim(), pts = parseInt(ptsEl.value);
  if (!name || isNaN(pts) || pts === 0) { nameEl.focus(); return; }
  rewards.push({ id: uid(), name, worth: pts });
  nameEl.value = ''; ptsEl.value = '-10'; nameEl.focus();
  save(); render();
}

function applyReward(id) {
  const r = rewards.find(r => r.id === id); if (!r) return;
  currentTotal += r.worth;
  save(); render(); flashCard(id, r.worth >= 0 ? 'flash-reward' : 'flash-cost');
}

// ── Rules ──────────────────────────────────────────────────────────

function addRule() {
  const ruleEl = document.getElementById('new-rule-text');
  const consEl = document.getElementById('new-rule-consequence');
  const rule = ruleEl.value.trim();
  const consequence = consEl.value.trim();
  if (!rule) { ruleEl.focus(); return; }
  rules.push({ id: uid(), rule, consequence });
  ruleEl.value = ''; consEl.value = ''; ruleEl.focus();
  save(); render();
}

// ── Shared helpers ─────────────────────────────────────────────────

function deleteItem(list, id) { const i = list.findIndex(x => x.id === id); if (i !== -1) list.splice(i,1); save(); render(); }
function deleteTask(id)   { deleteItem(tasks,   id); }
function deleteReward(id) { deleteItem(rewards, id); }
function deleteRule(id)   { deleteItem(rules,   id); }

function renameItem(list, id, val) { const x = list.find(x => x.id === id); if (x && val.trim()) x.name = val.trim(); save(); }
function renameTask(id, val)   { renameItem(tasks,   id, val); }
function renameReward(id, val) { renameItem(rewards, id, val); }
function updateRuleField(id, field, val) {
  const r = rules.find(r => r.id === id);
  if (r && val.trim()) r[field] = val.trim();
  save();
}

function changeWorth(id, val, list) { const x = list.find(x => x.id === id); const n = parseInt(val); if (x && !isNaN(n) && n !== 0) x.worth = n; save(); render(); }
function changeTaskWorth(id, val)   { changeWorth(id, val, tasks); }
function changeRewardWorth(id, val) { changeWorth(id, val, rewards); }

function flashCard(id, cls) {
  const card = document.querySelector('[data-id="' + id + '"]');
  if (!card) return;
  card.classList.remove('flash','flash-reward','flash-cost');
  void card.offsetWidth; card.classList.add(cls);
}

// ── Reset ──────────────────────────────────────────────────────────

let resetPending = false, resetTimer = null;

function resetAll() {
  if (!tasks.some(t => t.earned > 0) && currentTotal === 0) return;
  if (!resetPending) {
    resetPending = true;
    const btn = document.querySelector('.btn-reset-all');
    btn.textContent = 'Confirm reset?'; btn.style.color = 'var(--danger)'; btn.style.borderColor = '#d88';
    resetTimer = setTimeout(() => {
      resetPending = false; btn.textContent = 'Reset Points'; btn.style.color = ''; btn.style.borderColor = '';
    }, 2500);
    return;
  }
  clearTimeout(resetTimer); resetPending = false;
  const btn = document.querySelector('.btn-reset-all');
  btn.textContent = 'Reset Points'; btn.style.color = ''; btn.style.borderColor = '';
  tasks.forEach(t => t.earned = 0); currentTotal = 0;
  save(); render();
}

// ── Render ─────────────────────────────────────────────────────────

function render() {
  const totalEarned = tasks.reduce((s,t) => s + t.earned, 0);
  const logged = tasks.filter(t => t.earned > 0).length;

  document.getElementById('task-count').textContent    = tasks.length   ? tasks.length   + ' task'   + (tasks.length   !== 1 ? 's' : '') : '';
  document.getElementById('reward-count').textContent  = rewards.length ? rewards.length + ' reward' + (rewards.length !== 1 ? 's' : '') : '';
  document.getElementById('rule-count').textContent    = rules.length   ? rules.length   + ' card'   + (rules.length   !== 1 ? 's' : '') : '';

  const bar = document.getElementById('summary-bar');
  if (tasks.length || rewards.length || rules.length) {
    bar.style.display = 'flex';
    document.getElementById('stat-current').textContent = currentTotal;
    document.getElementById('stat-earned').textContent  = totalEarned;
    document.getElementById('stat-logged').textContent  = logged;
  } else { bar.style.display = 'none'; }

  // Tasks
  const tl = document.getElementById('tasks-list');
  if (!tasks.length) {
    tl.innerHTML = '<div class="empty-state"><div class="empty-icon">\u25fb</div>Add your first task above</div>';
  } else {
    tl.innerHTML = tasks.map(function(t) {
      return '<div class="task-card' + (t.earned > 0 ? ' has-points' : '') + '" data-id="' + t.id + '">'
        + '<span contenteditable="true" spellcheck="false" class="task-name"'
        + ' onblur="renameTask(\'' + t.id + '\', this.textContent)"'
        + ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur();}"'
        + '>' + esc(t.name) + '</span>'
        + '<span class="worth-badge" title="Edit to change point value">'
        + '<span contenteditable="true" spellcheck="false" style="outline:none;cursor:text;"'
        + ' onblur="changeTaskWorth(\'' + t.id + '\', this.textContent)"'
        + ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur();}"'
        + '>' + t.worth + '</span> pts ea.</span>'
        + '<div class="task-controls">'
        + '<button class="btn-decrement" onclick="decrement(\'' + t.id + '\')" title="Remove one increment">\u2212</button>'
        + '<span class="task-pts-value">' + t.earned + '</span>'
        + '<span class="pts-label">pts</span>'
        + '<button class="btn-increment" onclick="increment(\'' + t.id + '\')" title="Add ' + t.worth + ' points">+</button>'
        + '<button class="btn-delete" onclick="deleteTask(\'' + t.id + '\')" title="Remove task">\u2715</button>'
        + '</div></div>';
    }).join('');
  }

  // Rewards
  const rl = document.getElementById('rewards-list');
  if (!rewards.length) {
    rl.innerHTML = '<div class="empty-state"><div class="empty-icon">\u25fb</div>Add your first reward above</div>';
  } else {
    rl.innerHTML = rewards.map(function(r) {
      var isCost = r.worth < 0;
      var cls = isCost ? 'is-cost' : 'is-reward';
      var btnLabel = isCost ? 'Spend ' + r.worth + ' pts' : 'Claim +' + r.worth + ' pts';
      return '<div class="reward-card ' + cls + '" data-id="' + r.id + '">'
        + '<span contenteditable="true" spellcheck="false" class="task-name"'
        + ' onblur="renameReward(\'' + r.id + '\', this.textContent)"'
        + ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur();}"'
        + '>' + esc(r.name) + '</span>'
        + '<span class="worth-badge" title="Edit to change point value">'
        + '<span contenteditable="true" spellcheck="false" style="outline:none;cursor:text;"'
        + ' onblur="changeRewardWorth(\'' + r.id + '\', this.textContent)"'
        + ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur();}"'
        + '>' + r.worth + '</span> pts</span>'
        + '<button class="btn-reward" onclick="applyReward(\'' + r.id + '\')" title="' + btnLabel + '">' + btnLabel + '</button>'
        + '<button class="btn-delete" onclick="deleteReward(\'' + r.id + '\')" title="Remove reward">\u2715</button>'
        + '</div>';
    }).join('');
  }

  // Rules
  var rll = document.getElementById('rules-list');
  if (!rules.length) {
    rll.innerHTML = '<div class="empty-state"><div class="empty-icon">\u25fb</div>Add your first rule above</div>';
  } else {
    rll.innerHTML = rules.map(function(rule) {
      return '<div class="rule-card" data-id="' + rule.id + '">'
        + '<div class="rule-col rule-col-rule">'
        + '<div class="rule-col-label">Rule</div>'
        + '<span contenteditable="true" spellcheck="false" class="rule-col-text"'
        + ' onblur="updateRuleField(\'' + rule.id + '\', \'rule\', this.textContent)"'
        + ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur();}"'
        + '>' + esc(rule.rule || '') + '</span>'
        + '</div>'
        + '<div class="rule-col rule-col-consequence">'
        + '<div class="rule-col-label">Consequence</div>'
        + '<span contenteditable="true" spellcheck="false" class="rule-col-text"'
        + ' onblur="updateRuleField(\'' + rule.id + '\', \'consequence\', this.textContent)"'
        + ' onkeydown="if(event.key===\'Enter\'){event.preventDefault();this.blur();}"'
        + '>' + esc(rule.consequence || '') + '</span>'
        + '</div>'
        + '<div class="rule-delete-col">'
        + '<button class="btn-delete" onclick="deleteRule(\'' + rule.id + '\')" title="Remove rule">\u2715</button>'
        + '</div>'
        + '</div>';
    }).join('');
  }
  applyEditMode();
}

document.getElementById('new-task-name').addEventListener('keydown',   function(e) { if (e.key==='Enter') addTask(); });
document.getElementById('new-task-pts').addEventListener('keydown',    function(e) { if (e.key==='Enter') addTask(); });
document.getElementById('new-reward-name').addEventListener('keydown', function(e) { if (e.key==='Enter') addReward(); });
document.getElementById('new-reward-pts').addEventListener('keydown',  function(e) { if (e.key==='Enter') addReward(); });
document.getElementById('new-rule-text').addEventListener('keydown',        function(e) { if (e.key==='Enter') addRule(); });
document.getElementById('new-rule-consequence').addEventListener('keydown', function(e) { if (e.key==='Enter') addRule(); });

window.addEventListener('online',  function() { document.getElementById('offline-badge').textContent = 'Online'; });
window.addEventListener('offline', function() { document.getElementById('offline-badge').textContent = 'Offline Ready'; });

// ── Import / Export ─────────────────────────────────────────────────
function _isUserCancel(err) {
  if (!err) return false;
  if (err.name === 'AbortError' || err.name === 'NotAllowedError') return true;
  if (err.message && /cancel|abort|user/i.test(err.message)) return true;
  return false;
}

async function exportData() {
  // Export without IDs — imported items will get fresh UIDs
  const payload = {
    tasks: tasks.map(t => ({ name: t.name, worth: t.worth, earned: t.earned })),
    rewards: rewards.map(r => ({ name: r.name, worth: r.worth })),
    rules: rules.map(r => ({ rule: r.rule, consequence: r.consequence })),
    currentTotal: currentTotal,
    exportedAt: new Date().toISOString()
  };
  const json = JSON.stringify(payload, null, 2);
  try {
    if (window.showSaveFilePicker) {
      // Prefer File System Access API when available
      const opts = [{ description: 'JSON', accept: { 'application/json': ['.json'] } }];
      const handle = await window.showSaveFilePicker({ types: opts });
      const writable = await handle.createWritable();
      await writable.write(json);
      await writable.close();
      alert('Export saved.');
    } else {
      // Fallback: prompt for filename and trigger download
      const fname = prompt('Filename to save as', 'task-tracker.json') || 'task-tracker.json';
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
      alert('Export downloaded to your browser downloads folder.');
    }
  } catch (e) {
      if (_isUserCancel(e)) {
        console.log('User cancelled save.');
      } else {
        console.log('Save failed', e);
      }
  }
}

async function importData() {
  // Prefer File System Access API
  let text = null;
  try {
    if (window.showOpenFilePicker) {
        const [fileHandle] = await window.showOpenFilePicker({ types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }], multiple: false });
        const file = await fileHandle.getFile();
        text = await file.text();
        try { await processImported(text); } catch (err) { alert('Import failed: ' + err); }
    }
    else {
      // Fallback to input[type=file]
      const input = document.createElement('input'); input.type = 'file'; input.accept = '.json,application/json';
      return new Promise((resolve) => {
        input.addEventListener('change', function() {
          const f = input.files && input.files[0]; if (!f) { resolve(); return; }
          const reader = new FileReader();
          reader.onload = function(e) { text = e.target.result; try { processImported(text); } catch(err){ alert('Import failed: ' + err); } resolve(); };
          reader.readAsText(f);
        });
        input.click();
      });
    }
  } catch (e) {
    if (_isUserCancel(e)) { console.log('User cancelled open.');}
    else console.log('Open failed', e);
  }
}

async function processImported(text) {
  if (!text) { alert('No file selected'); return; }
  let data;
  try { data = JSON.parse(text); } catch (e) { alert('Invalid JSON'); return; }
  let added = { tasks: 0, rewards: 0, rules: 0 };
  if (Array.isArray(data.tasks)) {
    data.tasks.forEach(t => {
      const exists = tasks.some(x => x.name === t.name && Number(x.worth) === Number(t.worth));
      if (!exists) { tasks.push({ id: uid(), name: t.name || 'Untitled', worth: Number(t.worth) || 0, earned: Number(t.earned) || 0 }); added.tasks++; }
    });
  }
  if (Array.isArray(data.rewards)) {
    data.rewards.forEach(r => {
      const exists = rewards.some(x => x.name === r.name && Number(x.worth) === Number(r.worth));
      if (!exists) { rewards.push({ id: uid(), name: r.name || 'Untitled', worth: Number(r.worth) || 0 }); added.rewards++; }
    });
  }
  if (Array.isArray(data.rules)) {
    data.rules.forEach(rr => {
      const exists = rules.some(x => (x.rule === rr.rule) && (x.consequence === rr.consequence));
      if (!exists) { rules.push({ id: uid(), rule: rr.rule || '', consequence: rr.consequence || '' }); added.rules++; }
    });
  }
  save(); render();
  alert('Import complete. Added: ' + added.tasks + ' tasks, ' + added.rewards + ' rewards, ' + added.rules + ' rules.');
}

// Register service worker for PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js').then(function(reg) {
      console.log('SW registered:', reg.scope);
    }).catch(function(err) {
      console.log('SW registration failed:', err);
    });
  });
}

load();
applyTheme();

if (!tasks.length && !rewards.length && !rules.length) {
  tasks = [
    { id: uid(), name: 'Make bed',                         worth: 5,  earned: 0 },
    { id: uid(), name: 'Brush teeth (morning & night)',    worth: 5,  earned: 0 },
    { id: uid(), name: 'Get dressed on own',               worth: 5,  earned: 0 },
    { id: uid(), name: 'Eat breakfast/lunch/dinner',       worth: 5,  earned: 0 },
    { id: uid(), name: 'Put dirty clothes in hamper',      worth: 3,  earned: 0 },
    { id: uid(), name: 'Clean up toys after playing',      worth: 5,  earned: 0 },
